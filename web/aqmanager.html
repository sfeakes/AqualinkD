  function init_collapsible() {
    var coll = document.getElementsByClassName("collapsible");
    var i;
    for(i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        //console.log(content);
        if(content.style.maxHeight) {
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    }
    // open up the system information collapsable content
    document.getElementById("systembutton").dispatchEvent(new Event('click'));
    // disable the download log button on startup
    //disablebutton("downloadlog");
    //disabletoggle("logfile");
    //disabletoggle("seriallog");
  }

  function disablebutton(id) {
    //console.log("disable " + id);
    var button = document.getElementById(id);
    if(button) {
      button.disabled = true;
      button.classList.add("disablebutton");
    }
  }

  function enablebutton(id) {
    //console.log("enable " + id);
    var button = document.getElementById(id);
    if(button) {
      button.disabled = false;
      button.classList.remove("disablebutton");
    }
  }

  function setbuttontext(id, text) {
    //console.log("enable " + id);
    var button = document.getElementById(id);
    if(button) {
      button.value = text;
    }
  }

  function disabletoggle(id) {
    disablebutton(id);
    try {
      document.getElementById(id).parentNode.classList.add("disabletoggle");
    } catch (e) {
      console.log("error " + e)
    }
  }

  function enabletoggle(id) {
    enablebutton(id);
    try {
      document.getElementById(id).parentNode.classList.remove("disabletoggle");
    } catch (e) {
      console.log("error " + e)
    }
  }

  function tohex(value) {
    var rtn = parseInt(value).toString(16);
    if(rtn.length <= 1) return "0x0" + rtn;
    else return "0x" + rtn;
  }

  function todec(value) {
    let number = parseInt(value, 16);
    return number;
  }
  var _last_message_element = null;
  var _log_element_count = 0;
  const LOGS2DISPLAY = 500;
  var _log_div_pressed = -1;

  function update_log_message(message) {
    if(_log_div_pressed == -1) {
      document.getElementById("logs").addEventListener("mousedown", function(e) {
        _log_div_pressed = true;
      })
      document.getElementById("logs").addEventListener("mouseup", function(e) {
        _log_div_pressed = false;
      })
      _log_div_pressed = false;
    }
    //console.log(message);
    var element = document.createElement("div");
    element.classList.add("logline");
    if(message.startsWith("Error:")) {
      element.classList.add("logmsgerror");
    }
    if(message.startsWith("Warning:")) {
      element.classList.add("logmsgwarning");
    }
    var logcontainer = document.getElementById("logs");
    if(_log_element_count >= LOGS2DISPLAY) {
      try {
        logcontainer.firstElementChild.remove();
      } catch (e) {
        _log_element_count++;
      }
    } else {
      _log_element_count++;
    }
    element.appendChild(document.createTextNode(message));
    logcontainer.appendChild(element);
    _last_message_element = element;
    if(_log_div_pressed == false) {
      logcontainer.scrollTop = logcontainer.scrollHeight - logcontainer.clientHeight;
    }
  }

  function setloglevel(caller) {
    //console.log(caller.id);
    var id = parseInt(caller.id.split('_')[1]);
    var msg = {
      uri: "setloglevel",
      value: id
    };
    send_command(msg);
  }

  function setlogmask(caller) {
    //console.log(caller.id);
    var id = parseInt(caller.id.split('_')[1]);
    var addremove = "";
    if(caller.checked) {
      addremove = "addlogmask";
    } else {
      addremove = "removelogmask";
    }
    var msg = {
      uri: addremove,
      value: id
    };
    // If it's RSSD logmask, and we have filter, append that to the uri.
    if(caller.id == _rssd_logmask) {
      var filter = document.getElementById("rssd_filter").value;
      if(filter) {
        if(addremove == "addlogmask") {
          msg.uri = msg.uri + "/" + filter;
        }
      }
    }
    send_command(msg);
  }

  function requestFileDownload(caller) {
    var msg = {};

      //window.location = '/api/debug/download';
      downloadFile('/api/logfile/download', "aqualinkd.log", document.getElementById("logsize").value);
      return;
    } else if(caller.id == "downloadconfig") {
      downloadFile('/api/config/download', "aqualinkd.conf");
      return;
    }
    send_command(msg);
  }

  function editconfig(caller) {
    var msg = {
      uri: "config"
    };
    send_command(msg);
  }

  function saveconfig(caller) {
    var json_ordered = {
      uri: "config/set",
      values: {}
    };
    //console.log(_config);
    for(var obj in _config) {
      if(_config[obj].value !== undefined) {
        if(_config[obj].value) {
          json_ordered.values[obj] = _config[obj].value;
        } else if(_config[obj].allow_blank !== undefined && _config[obj].allow_blank == "yes") {
          //console.log("----- Add Blank value for "+ obj+"\n");
          json_ordered.values[obj] = "";
        }
      } else if(obj.toString().startsWith("button_") || obj.toString().startsWith("virtual_button_") || obj.toString().startsWith("sensor_")) {
        for(var obj1 in _config[obj]) {
          if(obj1.toString() != "advanced") {
            if(_config[obj][obj1].value) {
              json_ordered.values[obj1] = _config[obj][obj1].value;
            }
          }
        }
      }
    }
    //console.log(json_ordered);
    send_command(json_ordered);
    closeconfig();
  }

  function clearconfigtable() {
    const configtable = document.getElementById("config_table");
    while(configtable.rows.length > 0) {
      configtable.deleteRow(0);
    }
  }

  function closeconfig() {
    clearconfigtable();
    document.getElementById("config_options").classList.add("hide");
    document.getElementById("config_options_pane").classList.add("hide");
  }

  function resetConfig(caller) {
    clearconfigtable();
    populateconfigtable();
  }

    var h = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

    document.documentElement.style.setProperty('--max-config-height', (h - 30) + 'px');
    document.documentElement.style.setProperty('--max-config-table-height', (h - 140) + 'px');
    document.getElementById("config_options").classList.remove("hide");
    document.getElementById("config_options_pane").classList.remove("hide");
    populateconfigtable(data);
  }

  function cfgAddButtonOption(event) {

    for(var obj in _config) {
      if(obj.toString() == key) {
        var js = {};

        switch (type) {
          case "pumpIndex":
          case "lightMode":
          case "onetouchID":
          case "pumpMaxSpeed":
          case "pumpMinSpeed":
            js.type = "int";
            break;
          case "pumpID":
            js.type = "hex";
            break;
          case "pumpType":
            js.type = "string";
            let validvalues = ["", "JANDY ePUMP", "Pentair VS", "Pentair VF"];
            js['valid values'] = validvalues;
            break;
          case "pumpName":
          case "altLabel":
          case "runtime":
            js.type = "string";
            break;
        }
        js.value = "";
        _config[obj][key + "_" + type] = js;
        break;
      }
    }
 
    const configtable = document.getElementById("config_table");
    for(let i = 0; i < configtable.rows.length; i++) {
      if(configtable.rows[i].cells[0].getAttribute('button_key') !== null) {
        if(configtable.rows[i].cells[0].getAttribute('button_key') == key) {
          addConfigRow(true, _config[obj], key + "_" + type, i, true);
          break;
        }
      }
    }
  }

  function isNumber(n) {
    return !isNaN(parseFloat(n)) && !isNaN(n - 0)
  }

  function populateconfigtable(data = null) {
    _addedBlankLightProgram = false;
    _addedBlankSensor = false;
    _addedBlankVirtualButton = false;
    const configtable = document.getElementById("config_table");
    var showAdvanced = document.getElementById("show_advanced").checked;
    //console.log (data);
    if(data != null) _config = data;
    var lastKey = "";
    //var lastBtnNum = 0;
    //var lastSenNum = 0;
    //var vBtnCnt = 0;
    var maxSensor = 0;
    var maxLightProgramName = 0;
    for(var obj in _config) {
      var hideLineSeperator = false;
      if(!showAdvanced && _config[obj].advanced == "yes") {
        continue;
      }
      // Basic groupings by first letter change
      if(lastKey.charAt(0) == obj.toString().charAt(0)) {
        hideLineSeperator = true;
      }
      // More advanced groupings
      if(obj.toString().includes("device_id") && lastKey.includes("device_id")) {
        hideLineSeperator = true;
      } else if(obj.toString().includes("panel_time") && lastKey.includes("panel_time")) {
        // sync_panel_time and force_panel_time_sync_at_startup belong together, but the
        // first letter grouping above cannot see that ('s' then 'f').
        hideLineSeperator = true;
      } else if(obj.toString().includes("light_program_")) {
        hideLineSeperator = true;
        if(obj.toString().includes("light_program_01")) {
          hideLineSeperator = false;
        }
        const num = parseInt(obj.toString().match(/[0-9]+/));
        if(num > maxLightProgramName) maxLightProgramName = num;
      }
      if(_confighelp[obj.toString()] !== undefined) {
        //console.log("FOUND HELP");
        //console.log(_confighelp[obj.toString()]);
        const newRow = configtable.insertRow();
        const cell1 = newRow.insertCell();
        cell1.colSpan = 3;
        cell1.style.fontSize = "x-small";
        cell1.textContent = _confighelp[obj.toString()];
        if(!hideLineSeperator) {
          //newRow.style.borderBottom = "1px solid black";
          newRow.style.borderTop = "1px solid black";
          hideLineSeperator = true;
        }
      }
      if(lastKey.startsWith("light_program_") && !obj.toString().startsWith("light_program_")) {
        addLightProgramRow(parseInt(lastKey.match(/[0-9]+/)));
      } else if(lastKey.startsWith("sensor_") && !obj.toString().startsWith("sensor_")) {
        if(isNumber(lastKey.match(/[0-9]+/))) {
          addSensorRow(parseInt(lastKey.match(/[0-9]+/)));
        }
      } else if(lastKey.startsWith("virtual_button_") && !obj.toString().startsWith("virtual_button_")) {
        addVirtualButtonRow(parseInt(lastKey.match(/[0-9]+/)));
      }
      if(_config[obj].value !== undefined) {
        if(obj.toString().startsWith("light_program_")) {
          //console.log(obj.toString());
          let num = parseInt(lastKey.match(/[0-9]+/));
          num++;
          //console.log("check for light_program_"+String(num+1).padStart(2, '0'));
          //console.log("check for light_program_"+num);
          if(!('light_program_' + String(num + 1).padStart(2, '0') in _config)) {
            addConfigRow(hideLineSeperator, _config, obj, -1, true);
          } else {
            addConfigRow(hideLineSeperator, _config, obj);
          }
        } else {
          addConfigRow(hideLineSeperator, _config, obj);
        }
      } else if(obj.toString().startsWith("button_") || obj.toString().startsWith("virtual_button_")) {
        var hide = false;
        for(var obj1 in _config[obj]) {
          if(obj1.toString() == "default") {
            const newRow = configtable.insertRow();
            const cell1 = newRow.insertCell();
            cell1.colSpan = 3;
            cell1.style.fontSize = "small";
            cell1.style.paddingLeft = "5px";
            cell1.innerHTML = obj.toString() + " ( <b>" + _config[obj]["default"] + "</b> )";
            cell1.style.borderTop = "1px solid black";
            hide = true;
          } else if(obj1.toString() != "advanced") {
            if(obj1.toString().endsWith("_label") && !obj1.toString().startsWith("virtual_button")) {
              addConfigRow(hide, _config[obj], obj1);
            } else {
              addConfigRow(hide, _config[obj], obj1, -1, true);
            }
            hide = true;
          }
        }
        addButtonOptionRow(obj.toString(), !obj.toString().startsWith("button_"));
      } else if(obj.toString().startsWith("sensor_")) {
        var hide = false;
        for(var obj1 in _config[obj]) {
          if(obj1.toString() != "advanced") {
            addConfigRow(hide, _config[obj], obj1, -1, true);
            hide = true;
          }

  function webconfig_validateAndDisplay() {
    const jsonInput = document.getElementById('webconfig-json-input');
    const resultArea = document.getElementById('validation-result');
    const jsonString = jsonInput.value;
    // Clear previous results
    resultArea.className = '';
    resultArea.textContent = '';
    try {
      // Attempt to parse the string into a JavaScript object
      const jsonObject = JSON.parse(jsonString);
      // If parsing succeeds, format the JSON nicely (pretty print)
      const prettyJsonString = JSON.stringify(jsonObject, null, 2);
      addWebConfigLineNumber(prettyJsonString);
      // Update the text area with the pretty-printed JSON
      jsonInput.value = prettyJsonString;
      // Display success message
      resultArea.classList.add('valid_json');
      resultArea.textContent = 'JSON is VALID.';
      return true;
    } catch (error) {
      // If parsing fails, catch the error
      addWebConfigLineNumber(jsonString);
      // Display error message
      resultArea.classList.add('invalid_json');
      // The error object provides useful information about where the syntax error is
      resultArea.textContent = 'JSON is INVALID: ' + error.message;
    }
    return false;
  }

  function mergeMissingKeysRecursive(target, source) {
    // Ensure we are dealing with actual objects at this level
    if(typeof target !== 'object' || target === null || typeof source !== 'object' || source === null) {
      return target;
    }
    // Iterate over all keys in the source object
    for(const key in source) {
      if(Object.hasOwn(source, key)) {
        const sourceValue = source[key];
        const targetValue = target[key];
        // If the source value is a nested object and the target value is also 
        // a nested object (and not an array or null), recurse.
        if(typeof sourceValue === 'object' && sourceValue !== null && !Array.isArray(sourceValue) && typeof targetValue === 'object' && targetValue !== null && !Array.isArray(targetValue)) {
          // Recursively merge the nested objects
          target[key] = mergeMissingKeysRecursive(targetValue, sourceValue);
        } else if(targetValue === undefined) {
          // Otherwise, if the key is missing entirely in the target, add it
          target[key] = sourceValue;
          // console.log("Added missing key:", key);
        }
        // If the key already exists and is not an object pair ready for recursion, it is ignored (target takes precedence).
      }
    }
    return target;
  }

  function get_appropriate_ws_url() {
    var pcol;
    var u = document.URL;
    /*
     * We open the websocket encrypted if this page came on an
     * https:// url itself, otherwise unencrypted
     */
    if(u.substring(0, 5) == "https") {
      pcol = "wss://";
      u = u.substr(8);
    } else {
      pcol = "ws://";
      if(u.substring(0, 4) == "http") u = u.substr(7);
    }
    u = u.split('/');
    //alert (pcol + u[0] + ":6500");
    return pcol + u[0];
  }

  function isNewerVersion(version1, version2) {
    try {
      let [major1, minor1, patch1] = version1.split('.').map(Number => parseInt(Number, 10));
      let [major2, minor2, patch2] = version2.split('.').map(Number => parseInt(Number, 10));
      if(patch1 === undefined) {
        patch1 = 0;
      }
      if(patch2 === undefined) {
        patch2 = 0;
      }
      //console.log(version1+" major="+major1+", "+version2+" major="+major2);
      if(major1 > major2) return true;
      if(major1 < major2) return false;
      //console.log(version1+" minor="+minor1+", "+version2+" minor="+minor2);
      if(minor1 > minor2) return true;
      if(minor1 < minor2) return false;
      //Look for any strings that might be a pre-release
      if(version2.toLowerCase().includes("dev") || version2.toLowerCase().includes("dev") || version2.toLowerCase().includes("beta")) {
        patch2--;
      }
      //console.log(version1+" patch="+patch1+", "+version2+" patch="+patch2);
      return patch1 > patch2;
    } catch (e) {
      return false;
    }
  }

            selected = 'selected';
          }
          dropdown += '<option value="' + versionNumber + '"' + selected + '>' + versionNumber + exttext + '</option>';
        }
      }
      dropdown += '</select>';
      dropdown += '&nbsp;&nbsp;&nbsp;Include Dev Releases<input id="useprerelease" type="checkbox" onchange="populateVersionSelection(this)" name="prerelease" value="PreRelease" ' + (prerelease == true ? "checked" : "") + '/>';
      dropdown += '<br>'
      if(_latestVersionAvailable == _currentVersion) {
        dropdown += '<br>latest Release version already installed';
      }
      dropdown += '<br><input type="button" id="installVersion" onclick="send(this);aqdAlertClose();" value="Install"/>';
      dlg_head.innerHTML = dropdown;
      if(showversionwarning) {
        dlg_msg.innerHTML = 'Warning:<p style="font-size: small;">Config files are not always backward compatible when downgrading.<br>' + 'You may need to manually update <b>aqualinkd.conf & config.json</b>.</p>';
      } else {
        dlg_msg.innerText = "";
      }
    } catch (e) {
      alert("load error " + e);
    }
    //alert("loaded");
  }
  async function getVersions() {
    try {
      // Fetch the file from the specified path (make sure config.json exists)
      const response = await fetch(VERSION_URL, {
        cache: 'no-store'
      });
      if(!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      // Get the response as plain text
      const versions = await response.text();
      const versionObject = JSON.parse(versions);
      for(const release of versionObject) {
        if(!release.assets || release.prerelease == "true" || release.assets.length === 0) {
          continue;
        }
        const downloadUrl = release.assets[0].browser_download_url;
        if(downloadUrl) {
          _aqualinkVersions[release.tag_name] = {};
          _aqualinkVersions[release.tag_name].url = downloadUrl;
          _aqualinkVersions[release.tag_name].prerelease = release.prerelease;
        }
      }
      populateVersionSelection();
    } catch (error) {
      console.error('There was a problem fetching the config file:', error);
      let dlg_msg = document.getElementById("alertDialogMessage");
      //dlg_msg.innerText = "Error connecting to github, please check connection!\n\n"+VERSION_URL;
      dlg_msg.innerHTML = '<p>Error connecting to github, please check connection</p<<hr><p style="font-size: small;">' + VERSION_URL + '</p>';
    }
  }

  function getLatestVersion(url = "https://api.github.com/repos/AqualinkD/AqualinkD/releases/latest", tryagain = true) {
    var xmlhttp = new XMLHttpRequest();
    xmlhttp.onreadystatechange = function() {
      if(this.readyState == 4 && this.status == 200) {
        var JS = JSON.parse(this.responseText);
        _latestVersionAvailable = JS.tag_name.replace(/[^\d.-]/g, '');
        document.getElementById("latestaqualinkdversion").innerHTML = _latestVersionAvailable;
      } else if(this.readyState == 4 && this.status == 404) {
        //console.log("URL ERROR "+this.readyState+" "+this.status);
        if(tryagain) {
          // Try sfeakes repo
          getLatestVersion("https://api.github.com/repos/sfeakes/AqualinkD/releases/latest", false);
        }
      }
    };
    xmlhttp.open("GET", url);
    xmlhttp.send();
  }

  function aqdAlert(message) {
    document.getElementById("alertDialogHeader").innerText = '';
    document.getElementById('alertDialogMessage').innerText = message;
    document.getElementById('alertOverlay').style.display = 'block';
    document.getElementById('alertCustomDialog').style.display = 'block';
  }

  function aqdAlertClose() {
    document.getElementById("alertDialogHeader").innerText = '';
    document.getElementById('alertOverlay').style.display = 'none';
    document.getElementById('alertCustomDialog').style.display = 'none';
  }

  function timedAlert(message, timeout) {
    aqdAlert(message);
    // Set a timeout to automatically close the dialog
    if(timeout > 0) setTimeout(aqdAlertClose, timeout * 1000);
  }
